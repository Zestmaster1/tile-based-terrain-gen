<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #canvasContainer {
      position: relative;
      height: 1000px;
    }

    canvas {
      position: absolute;
      border: 1px solid black;
      height: min(80vw, 80vh);
    }

    input {
      width: 1500px;
    }

    body, button {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div>
    <label for="waterLevel">water level:</label>
    <input id="waterLevel" type="range" min="0" max="1" step="0.001" value="0" oninput="p.waterLevelChange()">
    <br>
    <label for="temperature">temperature: </label>
    <input id="temperature" type="range" min="0" max="1" step="0.001" value="0" oninput="p.temperatureChange()">
    <br>
    <button onclick="p.allGrass()">fill grass</button>
    <button onclick="p.allTrees()">fill  trees</button>
    <br>
    <button onclick="camera.x = 0; camera.y = 0;">center camera</button>
  </div>
  <br>
  <div id="canvasContainer">
    <canvas id="terrain"></canvas>
    <canvas id="world"></canvas>
    <canvas id="water"></canvas>
  </div>

  <script src="classes.js"></script>
  <script src="main.js"></script>
</body>
</html>
